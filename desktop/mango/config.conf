# =============================================================================
# OCEANUS — Mango compositor config
# Gerenciado pelo módulo hmModules.mango (wayland.windowManager.mango.extraConfig).
# O autostart.sh de systemd/D-Bus é gerado pelo módulo HM — não adicionar aqui.
# =============================================================================

# ---------------------------------------------------------------------------
# Variáveis de ambiente Wayland
# As variáveis críticas de sessão (WAYLAND_DISPLAY, XDG_CURRENT_DESKTOP,
# XDG_SESSION_TYPE, DISPLAY, NIXOS_OZONE_WL) são importadas pelo módulo HM
# no autostart.sh gerado automaticamente. Apenas complementos adicionais abaixo.
# ---------------------------------------------------------------------------
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_QPA_PLATFORM, wayland;xcb
env = MOZ_ENABLE_WAYLAND, 1
env = GDK_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

env = GTK_IM_MODULE, fcitx
env = QT_IM_MODULE, fcitx
env = SDL_IM_MODULE, fcitx
env = XMODIFIERS, @im=fcitx
env = GLFW_IM_MODULE, fcitx

# ---------------------------------------------------------------------------
# Autostart
# dbus/systemd e mango-session.target são gerenciados pelo módulo hmModules.mango.
# Adicionar aqui apenas serviços de usuário adicionais.
# ---------------------------------------------------------------------------
exec-once = noctalia-shell

# ---------------------------------------------------------------------------
# Monitor rules
# Descobrir os nomes reais com: wlr-randr (após logar no Mango)
# Exemplos comuns: DP-1, DP-3, HDMI-A-1, eDP-1
#
# Descomentar e ajustar com os nomes reais da sua máquina:
# monitorrule=name:DP-3,width:1920,height:1080,rate:60,x:0,y:0,scale:1
# monitorrule=name:HDMI-A-1,width:1920,height:1080,rate:60,x:1920,y:0,scale:1
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Aparência — OCEANUS
# Efeitos visuais desativados na fase de estabilização.
# Reativar após confirmar que o compositor inicia e os keybindings funcionam.
# ---------------------------------------------------------------------------
border_radius         = 0
no_radius_when_single = 0
borderpx              = 0
no_border_when_single = 0

shadows               = 0
shadow_only_floating  = 1
shadows_size          = 4
shadows_blur          = 6
shadows_position_x    = 0
shadows_position_y    = 2

focused_opacity   = 1.0
unfocused_opacity = 1.0

# blur=1.0             # reativar após estabilização
# blur_radius=8
# blur_passes=2

# ---------------------------------------------------------------------------
# Animações — desativadas durante estabilização
# ---------------------------------------------------------------------------
animations       = 0
layer_animations = 0

animation_type_open     = zoom
zoom_initial_ratio      = 0.92
zoom_end_ratio          = 1.0
fadein_begin_opacity    = 0.85
animation_duration_open = 200
animation_curve_open    = 0.22, 1.0, 0.36, 1

animation_type_close      = zoom
fadeout_begin_opacity     = 0.85
animation_duration_close  = 160
animation_curve_close     = 0.08, 0.92, 0, 1

tag_animation_direction = 0
animation_fade_in       = 1
animation_fade_out      = 1
animation_duration_tag  = 200
animation_curve_tag     = 0.46, 1.0, 0.29, 1

animation_duration_move  = 280
animation_curve_move     = 0.46, 1.0, 0.29, 1
animation_duration_focus = 0

# ---------------------------------------------------------------------------
# Gaps
# ---------------------------------------------------------------------------
gappih = 5
gappiv = 5
gappoh = 10
gappov = 10

# ---------------------------------------------------------------------------
# Layouts — grid como padrão
# ---------------------------------------------------------------------------
scroller_structs              = 20
scroller_default_proportion   = 0.8
scroller_focus_center         = 0
scroller_prefer_center        = 0
edge_scroller_pointer_focus   = 1
scroller_default_proportion_single = 1.0
scroller_proportion_preset    = 0.5, 0.8, 1.0

new_is_master     = 0
default_mfact     = 0.55
default_nmaster   = 1
smartgaps         = 0

hotarea_size    = 10
enable_hotarea  = 1
ov_tab_mode     = 0
overviewgappi   = 5
overviewgappo   = 30

scratchpad_width_ratio  = 0.75
scratchpad_height_ratio = 0.85

# ---------------------------------------------------------------------------
# Tags — 1 CODE  2 WEB  3 TERM  4 SCHOOL  5 COMMS  6 MEDIA  7 SYS  8 DEV  9 SCRATCH
# ---------------------------------------------------------------------------
tagrule = id:1, layout_name:grid
tagrule = id:2, layout_name:grid
tagrule = id:3, layout_name:grid
tagrule = id:4, layout_name:grid
tagrule = id:5, layout_name:grid
tagrule = id:6, layout_name:grid
tagrule = id:7, layout_name:grid
tagrule = id:8, layout_name:grid
tagrule = id:9, layout_name:grid

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
axis_bind_apply_timeout = 100
focus_on_activate       = 1
sloppyfocus             = 1
warpcursor              = 1
focus_cross_monitor     = 0
focus_cross_tag         = 0
enable_floating_snap    = 0
snap_distance           = 30
drag_tile_to_tile       = 1
allow_tearing           = 1
cursor_size             = 24

# ---------------------------------------------------------------------------
# Teclado — layout brasileiro (ABNT2)
# ---------------------------------------------------------------------------
repeat_rate   = 40
repeat_delay  = 250
numlockon     = 0
xkb_rules_layout = br

# ---------------------------------------------------------------------------
# Mouse
# ---------------------------------------------------------------------------
mouse_natural_scrolling = 0
accel_speed             = -0.5

# =============================================================================
# KEYBINDS
# =============================================================================

# Recarregar config
bind = SUPER+SHIFT, r, reload_config

# Aplicações
bind = SUPER, Return,       spawn, ghostty
bind = SUPER, E,            spawn, ghostty -e yazi
bind = SUPER+SHIFT, W,      spawn, brave
bind = SUPER+SHIFT, C,      spawn, ghostty -e nvim $HOME/.config/mango/config.conf

# Sistema
bind = SUPER+SHIFT, Q, quit
bind = SUPER, Q,       killclient,
bind = SUPER, C,       killclient,

# Janelas — foco (vi-style com Alt)
bind = ALT, H, focusdir, left
bind = ALT, J, focusdir, down
bind = ALT, K, focusdir, up
bind = ALT, L, focusdir, right

bind = ALT, Left,  focusdir, left
bind = ALT, Right, focusdir, right
bind = ALT, Up,    focusdir, up
bind = ALT, Down,  focusdir, down

bind = SUPER, Tab, focusstack, next

# Janelas — mover/trocar posição
bind = SUPER+SHIFT, H, exchange_client, left
bind = SUPER+SHIFT, J, exchange_client, down
bind = SUPER+SHIFT, K, exchange_client, up
bind = SUPER+SHIFT, L, exchange_client, right

# Janelas — estado
bind = SUPER, F,           togglefullscreen,
bind = SUPER+SHIFT, F,     togglefakefullscreen,
bind = SUPER+SHIFT, T,     togglefloating,
bind = SUPER, G,           toggleglobal,
bind = SUPER, I,           minimized,
bind = SUPER+SHIFT, I,     restore_minimized
bind = ALT, A,             togglemaximizescreen,
bind = ALT, Z,             toggle_scratchpad

# Layouts
bind = SUPER, N,     switch_layout
bind = ALT, E,       set_proportion, 1.0
bind = ALT, X,       switch_proportion_preset,
bind = SUPER, Z,     spawn, bash $HOME/.config/mango/scripts/toggle-float-mode.sh

# Overview & Overlay
bind = SUPER, O,       toggleoverview,
bind = SUPER+SHIFT, O, toggleoverlay,

# Tags — trocar / mover janela
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

bind = SUPER,       Left,  viewtoleft,  0
bind = SUPER,       Right, viewtoright, 0
bind = CTRL,        Left,  viewtoleft_have_client,  0
bind = CTRL,        Right, viewtoright_have_client, 0
bind = CTRL+SUPER,  Left,  tagtoleft,  0
bind = CTRL+SUPER,  Right, tagtoright, 0

# Monitores
bind = ALT+SHIFT, Left,  focusmon, left
bind = ALT+SHIFT, Right, focusmon, right
bind = SUPER+ALT, Left,  tagmon,   left
bind = SUPER+ALT, Right, tagmon,   right

# Noctalia
bind = SUPER, Space,  spawn, noctalia-shell ipc call launcher toggle
bind = SUPER, A,      spawn, noctalia-shell ipc call launcher toggle
bind = SUPER, S,      spawn, noctalia-shell ipc call controlCenter toggle
bind = SUPER, comma,  spawn, noctalia-shell ipc call settings toggle
bind = SUPER, V,      spawn, noctalia-shell ipc call launcher clipboard
bind = SUPER, L,      spawn, noctalia-shell ipc call lockScreen lock
bind = SUPER, J,      spawn, noctalia-shell ipc call bar toggle
bind = CTRL+SUPER, T, spawn, noctalia-shell ipc call wallpaper toggle

# Screenshots
bind = None,  Print, spawn, bash $HOME/.config/mango/scripts/screenshot-fullscreen.sh
bind = SHIFT, Print, spawn, bash $HOME/.config/mango/scripts/screenshot-selection.sh

# Gaps
bind = ALT+SHIFT, X, incgaps,    1
bind = ALT+SHIFT, Z, incgaps,   -1
bind = ALT+SHIFT, R, togglegaps

# Mover/redimensionar janelas flutuantes (teclado)
bind = CTRL+SHIFT, Up,    movewin, +0,  -50
bind = CTRL+SHIFT, Down,  movewin, +0,  +50
bind = CTRL+SHIFT, Left,  movewin, -50, +0
bind = CTRL+SHIFT, Right, movewin, +50, +0

bind = CTRL+ALT, Up,    resizewin, +0,  -50
bind = CTRL+ALT, Down,  resizewin, +0,  +50
bind = CTRL+ALT, Left,  resizewin, -50, +0
bind = CTRL+ALT, Right, resizewin, +50, +0

# Mouse bindings
mousebind = SUPER, btn_left,  moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize

# =============================================================================
# WINDOW RULES
# =============================================================================
windowrule = isfloating:1, appid:pavucontrol
windowrule = isfloating:1, appid:blueman-manager
windowrule = isfloating:1, appid:nm-connection-editor
windowrule = isfloating:1, appid:org.gnome.Calculator
windowrule = isfloating:1, appid:gnome-calculator
windowrule = isfloating:1, appid:polkit-gnome-authentication-agent-1
windowrule = isfloating:1, appid:org.kde.polkit-kde-authentication-agent-1
windowrule = isfloating:1, title:Picture-in-Picture

windowrule = width:900, height:600, appid:pavucontrol
windowrule = width:900, height:600, appid:blueman-manager

source = ./float.conf
